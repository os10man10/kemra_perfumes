<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>KEMRA PERFUMES</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #080706;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      width: min(100vw, 1024px);
      line-height: 0;
    }

    .design {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    .hotspot {
      position: absolute;
      display: block;
      z-index: 5;
      border-radius: 70px;
      background: transparent;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .instagram { left: 25.6%; top: 48.9%; width: 48.8%; height: 6.1%; }
    .facebook  { left: 25.6%; top: 56.8%; width: 48.8%; height: 6.1%; }
    .whatsapp  { left: 25.6%; top: 64.7%; width: 48.8%; height: 6.1%; }
    .tiktok    { left: 25.6%; top: 72.6%; width: 48.8%; height: 6.1%; }

    .hotspot::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 70px;
      background: rgba(212, 166, 73, 0);
      box-shadow: 0 0 0 rgba(212, 166, 73, 0);
      transform: scale(0.98);
      transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
      pointer-events: none;
    }

    .hotspot:hover::after {
      background: rgba(212, 166, 73, 0.13);
      box-shadow: 0 0 12px rgba(212, 166, 73, 0.45), inset 0 0 12px rgba(212, 166, 73, 0.18);
      transform: scale(1.02);
    }

    .hotspot:active::after { transform: scale(0.99); }

    @media (hover: none) {
      .hotspot:hover::after {
        background: transparent;
        box-shadow: none;
        transform: none;
      }
    }

    /* PHONE: force the complete artwork to occupy the entire visible viewport.
       The artwork is intentionally stretched vertically on narrow screens so
       no part is cropped and no black area remains underneath it. */
    @media (max-width: 600px) {
      html, body {
        width: 100%;
        height: var(--app-height, 100vh);
        min-height: var(--app-height, 100vh);
        max-height: var(--app-height, 100vh);
        overflow: hidden;
      }

      body { display: block; }

      .page {
        position: fixed;
        left: 0;
        top: 0;
        width: 100vw;
        height: var(--app-height, 100vh);
        max-width: none;
        min-height: 0;
        max-height: none;
        overflow: hidden;
      }

      .design {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        max-width: none;
        max-height: none;
        object-fit: fill;
      }
    }

    @media (max-width: 420px) {
      .instagram, .facebook, .whatsapp, .tiktok {
        left: 25.2%;
        width: 49.6%;
        height: 6.3%;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <img class="design" src="kemra-social-design.png" alt="KEMRA PERFUMES">

    <a class="hotspot instagram" href="https://www.instagram.com/kemra_perfumes/" target="_blank" rel="noopener noreferrer" aria-label="KEMRA Instagram"></a>
    <a class="hotspot facebook" href="https://www.facebook.com/share/18zhs9SmXH/" target="_blank" rel="noopener noreferrer" aria-label="KEMRA Facebook"></a>
    <a class="hotspot whatsapp" href="https://wa.me/201141613775" target="_blank" rel="noopener noreferrer" aria-label="KEMRA WhatsApp"></a>
    <a class="hotspot tiktok" href="https://www.tiktok.com/@kemra.perfumes" target="_blank" rel="noopener noreferrer" aria-label="KEMRA TikTok"></a>
  </main>

  <script>
    // Use the actual visible browser viewport height on phones.
    function setAppHeight() {
      document.documentElement.style.setProperty('--app-height', window.innerHeight + 'px');
    }
    setAppHeight();
    window.addEventListener('resize', setAppHeight, { passive: true });
    window.addEventListener('orientationchange', () => setTimeout(setAppHeight, 150), { passive: true });
  </script>
</body>
</html>
